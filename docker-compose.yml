services:

  acescraper:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-dev}"
    container_name: acescraper
    restart: unless-stopped
    ports:
      - "${PORT:-8888}:7777"
    volumes:
      - ./data:/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/acescraper.db
      LOGOS_DIR: /data/logos
      EPG_FILE: /data/epg.xml
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      #TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.getenv(\"APP_PORT\",\"8000\")}/api/config/')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
